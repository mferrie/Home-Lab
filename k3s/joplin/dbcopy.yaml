   apiVersion: batch/v1
   kind: Job
   metadata:
     name: joplin-db-copy
     namespace: joplin
   spec:
     template:
       spec:
         restartPolicy: Never
         containers:
           - name: copy
             image: alpine
             command: ["sh", "-c", "cp -a /old/. /new/ && ls -la /new"]
             volumeMounts:
               - { name: old, mountPath: /old }
               - { name: new, mountPath: /new }
         volumes:
           - name: old
             persistentVolumeClaim: { claimName: db-claim0 }
           - name: new
             persistentVolumeClaim: { claimName: db-data }
