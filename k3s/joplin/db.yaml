apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: joplin
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: joplin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                    name: joplin-database
                    key: postgres_pw
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                    name: joplin-database
                    key: postgres_user
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          image: postgres:16
          name: db
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: db-data
      restartPolicy: Always
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data

---

apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: joplin
  labels:
    app: db
spec:
  ports:
    - name: "db"
      port: 5432
      targetPort: 5432
  selector:
    app: db
