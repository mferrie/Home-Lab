apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: lgtm
spec:
  interval: 10m
  releaseName: prometheus
  chartRef:
    kind: OCIRepository
    name: prometheus-chart
  valuesFrom:
    - kind: ConfigMap
      name: prometheus-values
      valuesKey: values.yaml
