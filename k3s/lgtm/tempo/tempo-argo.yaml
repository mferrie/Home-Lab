apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://codeberg.org/kaizenOramara_97/Home-Lab.git
      targetRevision: HEAD
      ref: values
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: tempo
      targetRevision: 3.1.0
      helm:
        releaseName: tempo
        valueFiles:
          - $values/k3s/lgtm/tempo/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: lgtm
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
