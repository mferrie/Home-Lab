apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://codeberg.org/kaizenOramara_97/Home-Lab.git
    targetRevision: HEAD
    path: k3s/homepage
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
