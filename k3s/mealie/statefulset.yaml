apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pihole
  namespace: pihole-stateful
  labels:
    app: pihole
spec:
  serviceName: pihole-headless
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
  spec:
    priorityClassName: pihole-critical
    terminationGracePeriodSeconds: 30
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: pihole
              topologyKey: kubernetes.io/hostname
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    containers:
      - name: pihole
        image: pihole/pihole:2026.07.2
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: false
        ports:
          - http:
            port: 80
            containerPort: 80
            protocol: TCP
          - dns:
            port: 53
            containerPort: 53
            protocol: TCP
          - dns-udp:
            port: 53
            containerPort: 53
            protocol: UDP
        env:
          - name: FTLCONF_webserver_port
            value: "80"
          - name: VIRTUAL_HOST
            value: "pi.hole"
          - name: FTLCONF_misc_etc_dnsmasq_d
            value: "true"
          - name: FTLCONF_webserver_api_password
            valueFrom:
              secretKeyRef:
                name: pihole-admin
                key: password
          - name: FTLCONF_webserver_api_app_sudo
            value: "true"
          - name: FTLCONF_dns_listeningMode
            value: "all"
          - name: FTLCONF_dns_revServers
            value: "true, 192.168.0.0/24,192.168.0.1#53,localdomain"
          - name: FTLCONF_dns_upstreams
            value: "8.8.8.8,8.8.4.4"
