# k3s/nextcloud/helmrelease.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nextcloud
spec:
  interval: 1h
  url: https://nextcloud.github.io/helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  interval: 10m
  chart:
    spec:
      chart: nextcloud
      version: "9.2.0"        # the version Argo runs today
      sourceRef:
        kind: HelmRepository
        name: nextcloud
  valuesFrom:
    - kind: ConfigMap
      name: nextcloud-values
