# k3s/forgejo/helmrelease.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: forgejo
spec:
  type: oci
  interval: 1h
  url: oci://code.forgejo.org/forgejo-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  interval: 10m
  chart:
    spec:
      chart: forgejo
      version: "17.1.2"        # the version Argo runs today
      sourceRef:
        kind: HelmRepository
        name: forgejo
  valuesFrom:
    - kind: ConfigMap
      name: forgejo-values
