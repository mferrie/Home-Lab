# k3s/forgejo/helmrelease.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: immich
spec:
  type: oci
  interval: 1h
  url: oci://ghrc.io/immich-app/immich-charts/immich
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 10m
  chart:
    spec:
      chart: forgejo
      version: "0.13.4"
      sourceRef:
        kind: HelmRepository
        name: immich
  valuesFrom:
    - kind: ConfigMap
      name: immich-values
